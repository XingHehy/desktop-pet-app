name: Build DesktopPet

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: create/update a GitHub Release with this tag, for example v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release_tag.outputs.publish }}
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            normalized_message="$(printf '%s' "$COMMIT_MESSAGE" | tr -d '\r')"
            detected_tag="$(printf '%s' "$normalized_message" | grep -Eo 'v[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z]+)?' | head -n 1 || true)"
            if [[ -n "$detected_tag" ]]; then
              tag="$detected_tag"
            fi
          fi

          if [[ -z "$tag" ]]; then
            echo "No release tag found. Skipping build and GitHub Release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag: $tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            python-arch: x64
            package-name: DesktopPet-windows-x64
          - name: windows-x86
            os: windows-2022
            python-arch: x86
            package-name: DesktopPet-windows-x86
          - name: windows-arm64
            os: windows-11-arm
            python-arch: arm64
            package-name: DesktopPet-windows-arm64
          - name: macos-apple-silicon
            os: macos-15
            python-arch: arm64
            package-name: DesktopPet-macos-apple-silicon
          - name: macos-intel
            os: macos-15-intel
            python-arch: x64
            package-name: DesktopPet-macos-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name DesktopPet --add-data "generator;generator" app.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name DesktopPet --add-data "generator:generator" app.py

      - name: Show Windows build output
        if: runner.os == 'Windows'
        run: Get-ChildItem -LiteralPath dist

      - name: Show macOS build output
        if: runner.os == 'macOS'
        run: ls -la dist

      - name: Package Windows release zip
        if: runner.os == 'Windows'
        run: |
          $package = "${{ matrix.package-name }}"
          New-Item -ItemType Directory -Force -Path "package\$package\config" | Out-Null
          New-Item -ItemType Directory -Force -Path "package\$package\output" | Out-Null
          New-Item -ItemType Directory -Force -Path "package\$package\pets" | Out-Null
          Copy-Item -LiteralPath "dist\DesktopPet.exe" -Destination "package\$package\DesktopPet.exe" -Force
          Copy-Item -LiteralPath "pets\default" -Destination "package\$package\pets\default" -Recurse -Force
          Compress-Archive -Path "package\$package\*" -DestinationPath "package\$package.zip" -Force

      - name: Package macOS release zip
        if: runner.os == 'macOS'
        run: |
          package="${{ matrix.package-name }}"
          mkdir -p "package/$package/config" "package/$package/output" "package/$package/pets"
          cp -R "dist/DesktopPet.app" "package/$package/DesktopPet.app"
          cp -R "pets/default" "package/$package/pets/default"
          ditto -c -k --sequesterRsrc --keepParent "package/$package" "package/$package.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-${{ matrix.name }}
          path: package/${{ matrix.package-name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -la release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.zip --clobber
          else
            gh release create "$TAG_NAME" release-assets/*.zip --title "$TAG_NAME" --generate-notes --target "$GITHUB_SHA"
          fi
